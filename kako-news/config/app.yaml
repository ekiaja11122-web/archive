# ============================================================
#  تنظیمات عمومی سامانهٔ کاکو نیوز
#  این فایل قابل ویرایش دستی است و نیازی به تغییر کد ندارد.
#  کلیدها و رمزها اینجا نمی‌آیند — آن‌ها در فایل .env هستند.
# ============================================================

# نام و هویت خبرگزاری (در متن‌ها و لینک‌ها استفاده می‌شود)
brand:
  name: "کاکو نیوز"
  site_url: "https://kakonews.ir"
  # این عبارت انتهای پست تلگرام می‌آید
  telegram_footer: "کاکو نیوز | اخبار شیراز"

# دسته‌بندی‌های مجاز خبر. مدل بازنویسی فقط از همین فهرست انتخاب می‌کند.
# اگر دسته‌ای اضافه کردید، معادل وردپرسی‌اش را در بخش publishing.wordpress هم اضافه کنید.
categories:
  - "اجتماعی"
  - "فرهنگی"
  - "ورزشی"
  - "اقتصادی"
  - "حوادث"
  - "شهری و عمرانی"
  - "گردشگری"

# --- فیلتر مرتبط‌بودن با شیراز -----------------------------
# واژه‌نامه در config/shiraz-keywords.yaml است و آزادانه قابل ویرایش.
# آستانه‌ها بر اساس آزمایش روی دادهٔ واقع‌نما تنظیم شده‌اند:
#   خبر کاملاً شیرازی معمولاً ۹ تا ۱۵ می‌گیرد،
#   خبر سراسری منفی یا صفر،
#   و بازهٔ بینابین جای تصمیم مدل زبانی است.
relevance:
  # امتیاز مساوی یا بیشتر از این → قطعاً مرتبط (بدون تماس با مدل زبانی)
  certain_threshold: 4
  # امتیاز کمتر از این → قطعاً نامرتبط (بدون تماس با مدل زبانی)
  irrelevant_threshold: 1
  # تطبیق کلیدواژه در تیتر چند برابر تطبیق در متن ارزش دارد
  title_multiplier: 2
  # سقف جریمهٔ نشانه‌های سراسری، تا خبری که هم شیراز و هم تهران را
  # نام برده به‌اشتباه کنار گذاشته نشود
  max_negative_penalty: 3
  # برای خبرهای بازهٔ بینابین از مدل زبانی پرسیده شود؟
  # (هزینه دارد؛ اگر خاموش باشد، معیار همان irrelevant_threshold است)
  use_llm_for_uncertain: true
  # پرامپت قابل ویرایش طبقه‌بندی
  llm_prompt_file: "config/prompts/relevance.system.md"
  # true  → خبر نامرتبط بایگانی می‌شود (وضعیت irrelevant) و قابل بازبینی است
  # false → خبر نامرتبط کاملاً حذف می‌شود. توصیه نمی‌شود: بدون این داده‌ها
  #         نمی‌توان فهمید فیلتر کجا اشتباه کرده و واژه‌نامه را بهتر کرد.
  keep_irrelevant: true

# --- تشخیص تکراری ------------------------------------------
deduplication:
  # پنجرهٔ زمانی مقایسه: خبرهای قدیمی‌تر از این مقدار مقایسه نمی‌شوند
  lookback_hours: 48
  # آستانهٔ شباهت کلی (۰ تا ۱). دو گزارش از یک رویداد با نگارش کاملاً
  # متفاوت معمولاً بین ۰٫۵ تا ۰٫۷ می‌گیرند، و دو خبر بی‌ربط زیر ۰٫۲.
  similarity_threshold: 0.45
  # سهم شباهت تیتر در امتیاز نهایی (بقیه سهم متن است)
  title_weight: 0.5
  # حداکثر چند خبر اخیر با هر خبر تازه مقایسه شود
  max_candidates: 200
  # وقتی خبر تکراری تشخیص داده شد: ignore (نادیده بگیر) یا link (منبع تکمیلی)
  on_duplicate: "link"

# --- بازنویسی (جزئیات در مایل‌استون ۴) ----------------------
rewrite:
  # اگر خالی بماند، مقدار OPENAI_MODEL از .env استفاده می‌شود
  model: ""
  temperature: 0.3
  max_output_tokens: 2000
  # مسیر فایل‌های قابل ویرایش پرامپت و راهنمای نگارشی
  system_prompt_file: "config/prompts/rewrite.system.md"
  style_guide_file: "config/style-guide.md"
  # حداکثر تلاش مجدد در صورت خطای مدل
  max_retries: 2

  # --- محافظ کپی عینی ---
  # اگر مدل به‌جای بازنویسی، جمله‌های منبع را کپی کند، خبر پذیرفته نمی‌شود.
  # یک بار دیگر با تذکر صریح‌تر امتحان می‌شود و اگر باز هم کپی بود، خبر با
  # وضعیت failed کنار گذاشته می‌شود تا هرگز منتشر نشود.
  # مقادیر بر اساس آزمایش: بازنویسی واقعی ≈ ۰، تغییر چند کلمه ≈ ۰٫۳۹، کپی کامل = ۱
  max_verbatim_ratio: 0.15      # نسبت دنباله‌های ۸ کلمه‌ای مشترک با منبع
  max_verbatim_run: 12          # طولانی‌ترین دنبالهٔ کلمات یکسان با منبع

  # خط پایانی خبر. سامانه آن را از روی منابع واقعی می‌سازد، نه مدل زبانی —
  # این‌طور نام منبع همیشه درست است و منابع تکمیلی هم ذکر می‌شوند.
  append_source_line: true
  source_line_template: "منبع: {{SOURCES}}"

# --- تصاویر (جزئیات در مایل‌استون ۷) ------------------------
images:
  # ⚠️ هشدار کپی‌رایت: تصاویر منابع خبری معمولاً دارای حق نشر هستند.
  # با فعال بودن این گزینه تصویر دانلود و با ذکر منبع استفاده می‌شود،
  # اما مسئولیت بررسی مجوز هر تصویر بر عهدهٔ سردبیر است.
  download_enabled: true
  max_bytes: 5242880          # ۵ مگابایت
  allowed_types: ["image/jpeg", "image/png", "image/webp"]
  storage_dir: "data/images"

# --- انتشار (جزئیات در مایل‌استون ۶ و ۷) --------------------
publishing:
  # مقصدهای پیش‌فرضی که در پنل تأیید از قبل تیک خورده‌اند
  default_targets: ["website", "telegram"]
  wordpress:
    # وضعیت پست ساخته‌شده در وردپرس: publish یا draft
    post_status: "publish"
    # نگاشت دستهٔ داخلی به شناسهٔ دستهٔ وردپرس.
    # اگر شناسه را نمی‌دانید خالی بگذارید؛ سیستم بر اساس نام می‌سازد/پیدا می‌کند.
    category_map: {}
  telegram:
    # ارسال به‌صورت عکس + کپشن وقتی خبر تصویر دارد
    prefer_photo: true
    disable_web_page_preview: false
    # متن لینک پایانی پست
    read_more_label: "ادامه در سایت کاکو نیوز"
    # فاصلهٔ بین دو پست پیاپی (میلی‌ثانیه) — تلگرام به ارسال پشت‌سرهم
    # حساس است و محدودیت نرخ می‌گذارد
    delay_between_posts_ms: 3000

# --- زمان‌بندی ---------------------------------------------
scheduler:
  # اگر false باشد، زمان‌بند اجرا نمی‌شود و جمع‌آوری فقط دستی است
  enabled: true
  # حداقل فاصلهٔ مجاز بین دو بار خواندن یک منبع (ثانیه) — سپر ادب اینترنتی
  min_poll_interval_seconds: 300
  # حداکثر تعداد منبعی که هم‌زمان خوانده می‌شود
  concurrency: 3
