# ============================================================
#  تنظیمات عمومی سامانهٔ کاکو نیوز
#  این فایل قابل ویرایش دستی است و نیازی به تغییر کد ندارد.
#  کلیدها و رمزها اینجا نمی‌آیند — آن‌ها در فایل .env هستند.
# ============================================================

# نام و هویت خبرگزاری (در متن‌ها و لینک‌ها استفاده می‌شود)
brand:
  name: "کاکو نیوز"
  site_url: "https://kakonews.ir"
  # این عبارت انتهای پست تلگرام می‌آید
  telegram_footer: "کاکو نیوز | اخبار شیراز"

# دسته‌بندی‌های مجاز خبر. مدل بازنویسی فقط از همین فهرست انتخاب می‌کند.
# اگر دسته‌ای اضافه کردید، معادل وردپرسی‌اش را در بخش publishing.wordpress هم اضافه کنید.
categories:
  - "اجتماعی"
  - "فرهنگی"
  - "ورزشی"
  - "اقتصادی"
  - "حوادث"
  - "شهری و عمرانی"
  - "گردشگری"

# --- فیلتر مرتبط‌بودن با شیراز (جزئیات در مایل‌استون ۳) ------
relevance:
  # حداقل امتیاز کلیدواژه‌ای برای اینکه خبر «مرتبط» شمرده شود
  min_keyword_score: 1
  # اگر امتیاز کلیدواژه‌ای بین آستانهٔ پایین و بالا بود، از مدل زبانی
  # برای تصمیم نهایی پرسیده می‌شود (هزینه‌بر است، پس فقط موارد مشکوک)
  use_llm_for_uncertain: true
  # خبرهای نامرتبط حذف نمی‌شوند؛ با وضعیت irrelevant آرشیو می‌شوند
  keep_irrelevant: true

# --- تشخیص تکراری (جزئیات در مایل‌استون ۳) ------------------
deduplication:
  # پنجرهٔ زمانی مقایسه: خبرهای قدیمی‌تر از این مقدار مقایسه نمی‌شوند
  lookback_hours: 48
  # آستانهٔ شباهت عنوان (۰ تا ۱) برای تکراری شمردن
  title_similarity_threshold: 0.82
  # وقتی خبر تکراری تشخیص داده شد: ignore (نادیده بگیر) یا link (منبع تکمیلی)
  on_duplicate: "link"

# --- بازنویسی (جزئیات در مایل‌استون ۴) ----------------------
rewrite:
  # اگر خالی بماند، مقدار OPENAI_MODEL از .env استفاده می‌شود
  model: ""
  temperature: 0.3
  max_output_tokens: 2000
  # مسیر فایل‌های قابل ویرایش پرامپت و راهنمای نگارشی
  system_prompt_file: "config/prompts/rewrite.system.md"
  style_guide_file: "config/style-guide.md"
  # حداکثر تلاش مجدد در صورت خطای مدل
  max_retries: 2

# --- تصاویر (جزئیات در مایل‌استون ۷) ------------------------
images:
  # ⚠️ هشدار کپی‌رایت: تصاویر منابع خبری معمولاً دارای حق نشر هستند.
  # با فعال بودن این گزینه تصویر دانلود و با ذکر منبع استفاده می‌شود،
  # اما مسئولیت بررسی مجوز هر تصویر بر عهدهٔ سردبیر است.
  download_enabled: true
  max_bytes: 5242880          # ۵ مگابایت
  allowed_types: ["image/jpeg", "image/png", "image/webp"]
  storage_dir: "data/images"

# --- انتشار (جزئیات در مایل‌استون ۶ و ۷) --------------------
publishing:
  # مقصدهای پیش‌فرضی که در پنل تأیید از قبل تیک خورده‌اند
  default_targets: ["website", "telegram"]
  wordpress:
    # وضعیت پست ساخته‌شده در وردپرس: publish یا draft
    post_status: "publish"
    # نگاشت دستهٔ داخلی به شناسهٔ دستهٔ وردپرس.
    # اگر شناسه را نمی‌دانید خالی بگذارید؛ سیستم بر اساس نام می‌سازد/پیدا می‌کند.
    category_map: {}
  telegram:
    # ارسال به‌صورت عکس + کپشن وقتی خبر تصویر دارد
    prefer_photo: true
    disable_web_page_preview: false

# --- زمان‌بندی ---------------------------------------------
scheduler:
  # اگر false باشد، زمان‌بند اجرا نمی‌شود و جمع‌آوری فقط دستی است
  enabled: true
  # حداقل فاصلهٔ مجاز بین دو بار خواندن یک منبع (ثانیه) — سپر ادب اینترنتی
  min_poll_interval_seconds: 300
  # حداکثر تعداد منبعی که هم‌زمان خوانده می‌شود
  concurrency: 3
