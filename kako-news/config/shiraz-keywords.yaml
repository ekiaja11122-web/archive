  # ----------------------------------------------------------
  # نشانه‌های ضعیف: سایر شهرهای استان فارس
  # خبر این شهرها برای یک رسانهٔ محلی فارس ارزش دارد، ولی خبر
  # «شیراز» نیست — پس امتیاز کمتری می‌گیرد.
  # ----------------------------------------------------------
  - name: "شهرهای استان فارس"
    weight: 1
