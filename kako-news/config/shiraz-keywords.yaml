# ============================================================
#  واژه‌نامهٔ مرتبط‌بودن با شیراز و استان فارس
#
#  هر خبر خام بر اساس این فهرست امتیاز می‌گیرد. تطبیق در تیتر
#  چند برابر تطبیق در متن ارزش دارد (ضریب در config/app.yaml).
#
#  این فایل را آزادانه ویرایش کنید — هر چه کامل‌تر باشد، فیلتر دقیق‌تر
#  و نیاز به تماس با مدل زبانی (که هزینه دارد) کمتر می‌شود.
#  پس از ویرایش:  npm run filter -- --dry-run
# ============================================================

# --- عبارت‌هایی که پیش از امتیازدهی از متن حذف می‌شوند ------
# چرا لازم است: کلمهٔ «فارس» در «خبرگزاری فارس» یا «خلیج فارس» ربطی به
# استان فارس ندارد و بدون این فهرست، هر خبر سراسریِ فارس‌نیوز مرتبط
# شمرده می‌شد.
exclude_phrases:
  - "خبرگزاری فارس"
  - "فارس نیوز"
  - "فارسنیوز"
  - "خلیج فارس"
  - "زبان فارسی"
  - "ادبیات فارسی"
  - "خط فارسی"
  - "باشگاه خبرنگاران"

groups:
  # ----------------------------------------------------------
  # نشانه‌های قطعی: دیدن این‌ها یعنی خبر تقریباً حتماً محلی است
  # ----------------------------------------------------------
  - name: "شیراز"
    weight: 3
    # اجازهٔ پسوند: «شیرازی» و «شیرازی‌ها» هم تطبیق می‌کنند
    allow_suffix: true
    terms:
      - "شیراز"
      - "استان فارس"

  - name: "نهادهای شهری شیراز"
    weight: 3
    terms:
      - "شهرداری شیراز"
      - "شهردار شیراز"
      - "شورای شهر شیراز"
      - "شورای اسلامی شهر شیراز"
      - "مناطق شهرداری شیراز"
      - "سازمان قطار شهری شیراز"
      - "قطار شهری شیراز"
      - "مترو شیراز"
      - "آتش نشانی شیراز"
      - "آب و فاضلاب شیراز"
      - "اتوبوسرانی شیراز"
      - "سازمان تاکسیرانی شیراز"

  - name: "نهادهای استانی فارس"
    weight: 3
    terms:
      - "استانداری فارس"
      - "استاندار فارس"
      - "فرمانداری شیراز"
      - "فرماندار شیراز"
      - "دادگستری فارس"
      - "دادستان شیراز"
      - "پلیس فارس"
      - "پلیس راهور شیراز"
      - "نیروی انتظامی فارس"
      - "بهزیستی فارس"
      - "آموزش و پرورش فارس"
      - "آموزش و پرورش شیراز"
      - "اداره کل میراث فرهنگی فارس"
      - "میراث فرهنگی فارس"
      - "محیط زیست فارس"
      - "جهاد کشاورزی فارس"
      - "شرکت برق فارس"
      - "شرکت گاز فارس"
      - "اتاق بازرگانی شیراز"
      - "نماینده مردم شیراز"
      - "مجمع نمایندگان فارس"
      - "امام جمعه شیراز"

  - name: "دانشگاه‌ها و مراکز درمانی"
    weight: 3
    terms:
      - "دانشگاه شیراز"
      - "دانشگاه علوم پزشکی شیراز"
      - "دانشگاه هنر شیراز"
      - "دانشگاه آزاد شیراز"
      - "دانشگاه پیام نور شیراز"
      - "بیمارستان نمازی"
      - "بیمارستان فقیهی"
      - "بیمارستان شهید رجایی شیراز"
      - "بیمارستان قلب الزهرا"
      - "بیمارستان دستغیب"
      - "مرکز طبی کودکان شیراز"

  - name: "جاذبه‌ها و بناهای شاخص"
    weight: 3
    terms:
      - "تخت جمشید"
      - "پرسپولیس تاریخی"
      - "نقش رستم"
      - "نقش رجب"
      - "پاسارگاد"
      - "آرامگاه کوروش"
