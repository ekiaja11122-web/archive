    terms:
      - "معالی آباد"
      - "قصردشت"
      - "عفیف آباد"
      - "فرهنگ شهر"
      - "زرگری"
      - "قدوسی غربی"
      - "گلدشت معالی آباد"
      - "شهرک گلستان"
      - "شهر جدید صدرا"
      - "سنگ سیاه"
      - "بالاکفت"
      - "درب شازده"
      - "لب آب"
      - "محله سعدی"
      - "پودنک"
