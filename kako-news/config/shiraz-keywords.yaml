  # ----------------------------------------------------------
  # نشانه‌های متوسط: محله‌ها و معابر شیراز
  # این‌ها به‌تنهایی قطعی نیستند (اسم بعضی محله‌ها در شهرهای دیگر هم هست)
  # ولی کنار هم امتیاز را بالا می‌برند.
  # ----------------------------------------------------------
