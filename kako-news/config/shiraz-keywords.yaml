# --- نشانه‌های منفی -----------------------------------------
# حضور این‌ها *بدون* هیچ نشانهٔ مثبتی، یعنی خبر احتمالاً سراسری یا
# مربوط به جای دیگری است. جریمه عمداً کم است تا خبری که هم به شیراز
# و هم به تهران اشاره دارد قربانی نشود.
negative:
  weight: 1
  terms:
    - "تهران"
    - "اصفهان"
    - "مشهد"
    - "تبریز"
    - "کرج"
    - "اهواز"
    - "قم"
    - "رشت"
