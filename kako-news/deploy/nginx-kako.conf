# Nginx برای پنل مدیریت کاکو نیوز
#
# نصب:
#   sudo cp deploy/nginx-kako.conf /etc/nginx/sites-available/kako-panel
#   sudo ln -s /etc/nginx/sites-available/kako-panel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# گواهی رایگان SSL:
#   sudo certbot --nginx -d panel.kakonews.ir
#
# ⚠️ پنل خودش روی 127.0.0.1 گوش می‌دهد و مستقیم از اینترنت در دسترس
#    نیست. تنها راه رسیدن به آن همین پروکسی است — که یعنی همیشه از
#    HTTPS رد می‌شود.

server {
    listen 80;
    listen [::]:80;
    server_name panel.kakonews.ir;

    # هر چیزی جز تأیید گواهی، به HTTPS منتقل می‌شود
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.kakonews.ir;

    ssl_certificate     /etc/letsencrypt/live/panel.kakonews.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.kakonews.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # مرورگر تا یک سال فقط از HTTPS به این دامنه وصل می‌شود
    add_header Strict-Transport-Security "max-age=31536000" always;

    # پنل خودش هدرهای امنیتی می‌فرستد؛ این‌ها لایهٔ دوم‌اند
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # متن خبر می‌تواند طولانی باشد
    client_max_body_size 4m;

    access_log /var/log/nginx/kako-panel.access.log;
    error_log  /var/log/nginx/kako-panel.error.log;

    location / {
        proxy_pass http://127.0.0.1:7799;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # پنل برای شمارش تلاش‌های ناموفق ورود به IP واقعی نیاز دارد
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # ---------------------------------------------------------
    # اختیاری: اگر خواستید API خواندنی خبرها را عمومی کنید
    # (مثلاً برای یک فرانت‌اند جدا). این بخش فقط خبرهای منتشرشده
    # را می‌دهد. اگر لازم ندارید، همین‌طور کامنت بماند.
    # ---------------------------------------------------------
    # location /api/ {
    #     proxy_pass http://127.0.0.1:7799;
    #     proxy_set_header Host $host;
    #     # پاسخ‌ها یک دقیقه کش می‌شوند
    #     proxy_cache_valid 200 1m;
    # }
}
